<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111218" media="(prefers-color-scheme: dark)" />
    <!-- Applies the saved theme before the page draws, so dark mode never flashes white (see src/lib/theme.ts). -->
    <script>
      (() => {
        var theme = 'system';
        try { theme = localStorage.getItem('bivoz-theme') || 'system'; } catch {}
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>Oriana Agent</title>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
