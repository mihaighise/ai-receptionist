# Serves the built admin site and forwards /api to the API container.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
  }

  # Hashed build files never change, so browsers can keep them.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Every other address is a page of the React app (e.g. /businesses/new).
  location / {
    try_files $uri /index.html;
  }
}
