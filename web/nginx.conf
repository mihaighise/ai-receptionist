# Serves the built web app (owner app and admin site) and forwards /api to the API container.
server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3001;
    proxy_set_header Host $host;
    # The visitor's address, for the API's rate limits. Set (not appended to), so a visitor can't
    # send their own value and pretend to be someone else.
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Hashed build files never change, so browsers can keep them.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Every other address is a page of the React app (e.g. /setup). index.html names the current
  # build files, so browsers check for a new one every time instead of showing an old version.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
